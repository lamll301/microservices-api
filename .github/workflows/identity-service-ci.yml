name: identity-service CI

on:
  push:
    branches: ['**']
    paths:
      - 'services/identity-service/**'
      - 'building-blocks/**'
      - '.github/workflows/identity-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/identity-service/**'
      - 'building-blocks/**'
      - '.github/workflows/identity-service-ci.yml'
  workflow_dispatch:   # cho phép bấm chạy tay trên tab Actions

concurrency:
  group: identity-service-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Đã bỏ working-directory mặc định để thao tác linh hoạt từ gốc repo (.)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore services/identity-service/tests/IdentityService.Tests/IdentityService.Tests.csproj

      - name: Build
        run: dotnet build services/identity-service/tests/IdentityService.Tests/IdentityService.Tests.csproj -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test services/identity-service/tests/IdentityService.Tests/IdentityService.Tests.csproj
          -c Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --results-directory services/identity-service/TestResults

      - name: Integration tests (PostgreSQL qua Testcontainers)
        run: >
          dotnet test services/identity-service/tests/IdentityService.Tests/IdentityService.Tests.csproj
          -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"
          --results-directory services/identity-service/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/identity-service/TestResults
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t identity-service:ci -f services/identity-service/src/Dockerfile .