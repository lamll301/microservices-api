services:
  postgres:
    image: postgres:16-alpine
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"   # mở ra host để bạn dùng DBeaver/pgAdmin; xóa dòng này nếu không cần
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Server SMTP giả lập cho môi trường dev: bắt mọi email gửi ra, xem tại http://localhost:8025
  # Khi lên production: xóa service này và trỏ SMTP_HOST/SMTP_PORT sang SMTP thật.
  mailpit:
    image: axllent/mailpit:latest
    container_name: identity-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # giao diện web xem email
      - "1025:1025"   # cổng SMTP (để chạy dotnet run ngoài docker vẫn gửi được)

  identity-service:
    build:
      context: ../..   # thư mục gốc repo, để Docker thấy cả building-blocks/
      dockerfile: services/identity-service/src/Dockerfile
    container_name: identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Trong mạng docker, host của DB là tên service "postgres", port nội bộ luôn là 5432
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-identity-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-microservices-api}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULLNAME: ${ADMIN_FULLNAME:-Administrator}
      SEED_DATA: ${SEED_DATA:-true}
      TOKEN_CLEANUP_ENABLED: ${TOKEN_CLEANUP_ENABLED:-true}
      TOKEN_CLEANUP_INTERVAL_HOURS: ${TOKEN_CLEANUP_INTERVAL_HOURS:-6}
      TOKEN_CLEANUP_RETENTION_DAYS: ${TOKEN_CLEANUP_RETENTION_DAYS:-7}
      # Email: mặc định gửi vào Mailpit. Muốn dùng SMTP thật thì sửa 2 dòng SMTP_HOST/SMTP_PORT bên dưới.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@identity-service.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Identity Service}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5137}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REQUIRE_CONFIRMED_EMAIL: ${REQUIRE_CONFIRMED_EMAIL:-true}
      EMAIL_TOKEN_LIFESPAN_HOURS: ${EMAIL_TOKEN_LIFESPAN_HOURS:-2}
      EMAIL_RATE_LIMIT_PERMITS: ${EMAIL_RATE_LIMIT_PERMITS:-10}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    ports:
      - "5137:8080"

volumes:
  identity_pgdata:
